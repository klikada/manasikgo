00;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" />
    <link rel="stylesheet" href="assets/css/animation.css" />
  </head><body><script src="assets/js/navbar.js"></script><header class="page-header"><div class="container"><span class="eyebrow">Peta</span><h1 class="display-5 fw-bold">Lokasi Penting Jamaah</h1><p class="lead lead-muted">Ketuk salah satu lokasi untuk melihat pratinjau petanya di sini, atau gunakan tombol rute untuk navigasi langsung lewat Google Maps.</p></div></header><main class="section"><div class="container"><div class="row g-4"><div class="col-lg-7"><iframe class="ratio-map rounded-4" id="mapPreview" loading="lazy" title="Pratinjau Peta" src="https://www.google.com/maps?q=Masjidil%20Haram&output=embed"></iframe><p class="small lead-muted mt-2 mb-0" id="mapPreviewCaption"><i class="bi bi-geo-alt text-primary"></i> Menampilkan Masjidil Haram</p></div><div class="col-lg-5"><div id="mapGroups"></div></div></div></div></main><script src="assets/js/footer.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="assets/js/api.js" defer></script><script src="assets/js/auth.js" defer></script><script src="assets/js/seo-routes.js" defer></script><script src="assets/js/app.js" defer></script>
  <script src="assets/js/darkmode.js" defer></script><script src="assets/js/content-data.js" defer></script><script defer>
document.addEventListener("DOMContentLoaded", async () => {
  // Ambil SEMUA destinasi dari database Peta, apapun kategorinya
  // (Peta/Ziarah/Transportasi), bukan hanya yang berkategori "Peta".
  let items = HCContent.maps.map(([nama, maps]) => ({ nama, maps }));
  try {
    const rows = await HCApi.getPeta();
    if (rows && rows.length) items = rows.map((r) => ({
      nama: r.nama,
      maps: r.maps,
      kategori: r.kategori,
      lokasi: r.lokasi,
      deskripsi: r.deskripsi,
      rating: r.rating,
      jarak: r.jarak,
      estimasi: r.estimasi,
      harga: r.harga,
      gambar: r.gambar,
    }));
  } catch (e) { console.info(e.message); }

  const extractQuery = (url) => {
    try {
      const u = new URL(url);
      return u.searchParams.get("query") || u.searchParams.get("q") || "";
    } catch (e) { return ""; }
  };
  const embedUrl = (query) => `https://www.google.com/maps?q=${encodeURIComponent(query)}&output=embed`;
  const directionsUrl = (query) => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(query)}`;
  const classify = (item) => {
    const n = (item.nama || "").toLowerCase();
    const kategori = item.kategori || "";
    if (kategori === "Ziarah") return { group: "Ziarah & Wisata Sejarah", icon: "bi-signpost-split" };
    if (kategori === "Transportasi") return { group: "Transportasi", icon: "bi-airplane" };
    if (n.includes("masjid")) return { group: "Masjid & Tempat Ibadah", icon: "bi-moon-stars-fill" };
    if (n.includes("bandara")) return { group: "Transportasi", icon: "bi-airplane" };
    if (n.includes("stasiun") || n.includes("kereta")) return { group: "Transportasi", icon: "bi-train-front" };
    if (n.includes("rumah sakit")) return { group: "Kesehatan & Layanan", icon: "bi-hospital" };
    if (n.includes("apotek")) return { group: "Kesehatan & Layanan", icon: "bi-capsule" };
    if (n.includes("atm") || n.includes("bank")) return { group: "Keuangan", icon: "bi-cash-coin" };
    return { group: "Lokasi Manasik", icon: "bi-geo-alt" };
  };

  const enriched = items.map((item) => ({ ...item, query: extractQuery(item.maps) || item.nama, ...classify(item) }));
  const grouped = enriched.reduce((acc, item) => {
    acc[item.group] = acc[item.group] || [];
    acc[item.group].push(item);
    return acc;
  }, {});

  const preview = document.getElementById("mapPreview");
  const caption = document.getElementById("mapPreviewCaption");
  const showPreview = (item) => {
    preview.src = embedUrl(item.query);
    caption.innerHTML = `<i class="bi bi-geo-alt text-primary"></i> Menampilkan ${item.nama}`;
    document.querySelectorAll("[data-preview]").forEach((el) => el.classList.toggle("active", el.dataset.name === item.nama));
  };

  document.getElementById("mapGroups").innerHTML = Object.keys(grouped).map((group) => `
    <section class="mb-4">
      <h2 class="h6 fw-bold mb-2"><i class="bi ${grouped[group][0].icon} text-primary"></i> ${group}</h2>
      <div class="info-list">${grouped[group].map((item) => `
        <div class="mini-map-link" data-preview data-name="${item.nama}" role="button" tabindex="0" aria-label="Lihat pratinjau peta ${item.nama}">
          ${item.gambar ? `<img class="mini-map-thumb" src="${item.gambar}" alt="${item.nama}" loading="lazy" onerror="this.remove()">` : ""}
          <div class="mini-map-body">
            <div class="mini-map-top">
              <span class="mini-map-title"><i class="bi ${item.icon} text-primary"></i> ${item.nama}</span>
              <a class="btn btn-sm btn-outline-primary" href="${directionsUrl(item.query)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="bi bi-signpost-2"></i> Rute</a>
            </div>
            ${item.lokasi ? `<p class="mini-map-loc mb-1"><i class="bi bi-pin-map"></i> ${item.lokasi}</p>` : ""}
            ${item.deskripsi ? `<p class="mini-map-desc mb-1">${item.deskripsi}</p>` : ""}
            <div class="mini-map-meta">
              ${item.rating ? `<span class="mini-map-chip"><i class="bi bi-star-fill text-warning"></i> ${item.rating}</span>` : ""}
              ${item.jarak ? `<span class="mini-map-chip"><i class="bi bi-signpost"></i> ${item.jarak}</span>` : ""}
              ${item.estimasi ? `<span class="mini-map-chip"><i class="bi bi-clock"></i> ${item.estimasi}</span>` : ""}
              ${item.harga ? `<span class="mini-map-chip"><i class="bi bi-cash-coin"></i> ${item.harga}</span>` : ""}
            </div>
          </div>
        </div>
      `).join("")}</div>
    </section>
  `).join("");

  document.getElementById("mapGroups").addEventListener("click", (event) => {
    const card = event.target.closest("[data-preview]");
    if (!card) return;
    const item = enriched.find((i) => i.nama === card.dataset.name);
    if (item) showPreview(item);
  });
  document.getElementById("mapGroups").addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const card = event.target.closest("[data-preview]");
    if (!card) return;
    event.preventDefault();
    const item = enriched.find((i) => i.nama === card.dataset.name);
    if (item) showPreview(item);
  });

  if (enriched[0]) showPreview(enriched[0]);
});
  </script></body></html>
