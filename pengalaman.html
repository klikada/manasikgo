    <script>
      (function () {
        try {
          var t = localStorage.getItem("manasikgo-theme");
          if (!t) {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("theme-dark-preload");
          }
        } catch (e) {}
      })();
    </script>
