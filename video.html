<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("manasikgo-theme");
          if (!t) {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("theme-dark-preload");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video &amp; Short Haji dan Umrah | ManasikGo</title>
    <meta
      name="description"
      content="Video tutorial, manasik, tips, doa, dan pengalaman jamaah, lengkap dengan Short/Reels dari YouTube, TikTok, dan Instagram."
    />
    <link rel="canonical" href="https://klikada.github.io/manasikgo/video.html" /><meta property="og:type" content="website"><meta property="og:title" content="Video &amp; Short Haji dan Umrah | ManasikGo"><meta property="og:description" content="Panduan Haji dan Umrah ManasikGo."><meta property="og:image" content="https://klikada.github.io/manasikgo/assets/images/logo.png"><meta property="og:url" content="https://klikada.github.io/manasikgo/video.html"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Video &amp; Short Haji dan Umrah | ManasikGo"><meta name="twitter:description" content="Panduan Haji dan Umrah ManasikGo."><meta name="twitter:image" content="https://klikada.github.io/manasikgo/assets/images/logo.png">
    <link rel="icon" href="assets/images/logo.png" type="image/png"><link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" />
    <link rel="stylesheet" href="assets/css/animation.css" />
  </head>
  <body>
    <script src="assets/js/navbar.js"></script>
    <header class="page-header">
      <div class="container">
        <span class="eyebrow">Video &amp; Short</span>
        <h1 class="display-5 fw-bold">Video &amp; Short Edukasi</h1>
        <p class="lead lead-muted">
          Video panjang dan Short/Reels untuk kategori tutorial, manasik, tips,
          doa, dan pengalaman jamaah dari YouTube, TikTok, dan Instagram.
        </p>
      </div>
    </header>
    <main class="section">
      <div class="container">
        <div
          class="d-flex flex-wrap gap-2 mb-4 video-type-tabs"
          role="group"
          aria-label="Filter tipe konten"
        >
          <button
            type="button"
            class="btn btn-primary btn-sm"
            data-video-filter="semua"
          >
            Semua</button
          ><button
            type="button"
            class="btn btn-outline-primary btn-sm"
            data-video-filter="Video"
          >
            <i class="bi bi-play-btn"></i> Video</button
          ><button
            type="button"
            class="btn btn-outline-primary btn-sm"
            data-video-filter="Short"
          >
            <i class="bi bi-phone"></i> Short
          </button>
        </div>
        <div class="row g-4" id="videos"></div>
      </div>
    </main>
    <script src="assets/js/footer.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="assets/js/api.js" defer></script><script src="assets/js/auth.js" defer></script>
    <script src="assets/js/seo-routes.js" defer></script><script src="assets/js/app.js" defer></script>
    <script src="assets/js/darkmode.js" defer></script>
    <script src="assets/js/content-data.js" defer></script>
    <script src="assets/js/short-feed.js" defer></script>
    <script defer>
      document.addEventListener("DOMContentLoaded", async () => {
        const items = await HCApi.getVideos();
        const platformIcon = {
          YouTube: "bi-youtube",
          TikTok: "bi-tiktok",
          Instagram: "bi-instagram",
        };
        // Video biasa tetap tampil lewat iframe (memang diputar di tempat).
        // Short pakai gambar thumbnail asli videonya saja -- bukan iframe --
        // supaya kartu pratinjau tidak menampilkan "halaman web" dari
        // YouTube/TikTok/Instagram; video sungguhan baru dimuat saat kartu
        // diklik dan dibuka fullscreen lewat HCShortFeed.
        const renderMedia = (item, shortIndex) => {
          if (item.tipe === "Short") {
            return `<div class="video-frame is-short">${window.HCVideoThumb?.html(item, shortIndex) || ""}<div class="video-short-play-badge"><i class="bi bi-arrows-fullscreen"></i></div></div>`;
          }
          if (item.embedUrl) {
            return `<iframe class="video-frame" src="${item.embedUrl}" title="${item.judul}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
          }
          const bukaLink = item.sourceUrl
            ? `<a class="btn btn-sm btn-outline-primary mt-3" href="${item.sourceUrl}" target="_blank" rel="noopener">Buka di ${item.platform}</a>`
            : "";
          return `<div class="video-frame d-flex flex-column align-items-center justify-content-center text-center p-3 small lead-muted">Link video belum valid.<br>Isi dengan link ${item.platform} yang benar di Admin Panel.${bukaLink}</div>`;
        };
        const renderList = (filter) => {
          const filtered =
            filter === "semua"
              ? items
              : items.filter((item) => item.tipe === filter);
          const shortsOnly = items.filter((item) => item.tipe === "Short");
          videos.innerHTML = filtered.length
            ? filtered
                .map((item) => {
                  const isShort = item.tipe === "Short";
                  const shortIndex = isShort ? shortsOnly.indexOf(item) : -1;
                  const openAttrs = isShort
                    ? `data-short-index="${shortIndex}" role="button" tabindex="0" aria-label="Buka ${item.judul} fullscreen"`
                    : "";
                  return `<div class="col-lg-4 col-md-6"><article class="video-card${isShort ? " is-short" : ""}" ${openAttrs}>${renderMedia(item, shortIndex)}<div class="p-4 text-center">
          <span class="badge-soft mb-3"><i class="bi ${platformIcon[item.platform] || "bi-play-circle"} video-platform-icon"></i>${item.kategori}${isShort ? " &middot; Short" : ""}</span>
          <h2 class="h5 fw-bold">${item.judul}</h2>
        </div></article></div>`;
                })
                .join("")
            : `<div class="col-12 text-center lead-muted py-5">Belum ada konten untuk filter ini.</div>`;
          videos.querySelectorAll("[data-short-index]").forEach((card) => {
            const openFeed = () =>
              window.HCShortFeed?.open(
                shortsOnly,
                Number(card.dataset.shortIndex),
              );
            card.addEventListener("click", openFeed);
            card.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openFeed();
              }
            });
          });
          window.HCVideoThumb?.load(videos, shortsOnly);
        };
        renderList("semua");
        document.querySelectorAll("[data-video-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("[data-video-filter]").forEach((b) => {
              b.classList.remove("btn-primary");
              b.classList.add("btn-outline-primary");
            });
            btn.classList.remove("btn-outline-primary");
            btn.classList.add("btn-primary");
            renderList(btn.dataset.videoFilter);
          });
        });
      });
    </script>
  </body>
</html>
